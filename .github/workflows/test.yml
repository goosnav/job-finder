name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
      - run: uv sync --project app --locked
      - run: uv run --project app ruff check --config app/pyproject.toml app/src tests
      - run: uv run --project app python -m pytest -c app/pyproject.toml tests
      - run: uv run --project app python scripts/launcher/test_packaging.py
      - run: uv run --project app python app/run.py --help
      - if: runner.os == 'Windows'
        name: Install real Windows agent CLIs
        shell: pwsh
        run: npm install --global --prefix "$env:RUNNER_TEMP\Job Finder Agent Contracts" --no-audit --no-fund @openai/codex@0.164.0 @anthropic-ai/claude-code@2.1.310
      - if: runner.os == 'Windows'
        name: Check real Windows agent discovery and options without sign-in
        shell: pwsh
        run: uv run --project app python scripts/smoke_windows_installed_agents.py --prefix "$env:RUNNER_TEMP\Job Finder Agent Contracts"
      - if: runner.os == 'Windows'
        run: uv run --project app python scripts/smoke_windows_launcher.py
      - if: runner.os == 'Linux'
        run: uv run --project app playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: uv run --project app python scripts/smoke_gui.py
      - if: runner.os == 'Linux'
        run: uv run --project app python scripts/smoke_agent_recovery.py
